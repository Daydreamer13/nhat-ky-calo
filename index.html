<body>

  <defs>
    <radialGradient id="ph-light" cx=".28" cy=".18" r="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".26"/>

    <g id="leaf-full"><use href="#leaf-shape"/><path class="ill-vein" d="M5 0H28"/></g>

      <path class="f-bloom-light" d="M0-3C-3.2-9-3.2-17 0-25 3.2-17 3.2-9 0-3z"/>

    <!-- five-petal flower, centred on 0,0, r≈10 -->

      <g class="f-bloom"><circle cy="-6" r="4.6"/><circle cy="-6" r="4.6" transform="rotate(72)"/><circle cy="-6" r="4.6" transform="rotate(144)"/><circle cy="-6" r="4.6" transform="rotate(216)"/><circle cy="-6" r="4.6" transform="rotate(288)"/></g>
      <circle class="f-sun" r="3.6"/>
    </g>

    <!-- wreath: leaves drawn at 12 o'clock of the r=80 ring centred on 100,100.
         One outer leaf every 36°; each opens when the arc (--pct) has passed its angle (--a). -->
    <path id="wreath-out" d="M100 20C103 9 110 3 121.5 2 118.5 13 111.4 19 100 20z"/>
    <path id="wreath-in" d="M100 20C102 27.7 107 32 115 32.6 113 25 108 20.7 100 20z"/>

        <use href="#wreath-out" class="wreath__leaf" style="--a:46" transform="rotate(46 100 100)"/>
        <use href="#wreath-out" class="wreath__leaf" style="--a:82" transform="rotate(82 100 100)"/>

        <use href="#wreath-out" class="wreath__leaf" style="--a:190" transform="rotate(190 100 100)"/>
        <use href="#wreath-out" class="wreath__leaf" style="--a:226" transform="rotate(226 100 100)"/>
        <use href="#wreath-out" class="wreath__leaf" style="--a:262" transform="rotate(262 100 100)"/>
        <use href="#wreath-out" class="wreath__leaf" style="--a:298" transform="rotate(298 100 100)"/>

      <g class="f-leaf-light">

        <use href="#wreath-in" class="wreath__leaf" style="--a:316" transform="rotate(316 100 100)"/>
      </g>
    </g>

    <path id="petal-6-in" d="M42 42C33.5 34 35.5 21 42 14c6.5 7 8.5 20 0 28z"/>

  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.2A7.8 7.8 0 1 1 9.8 4.5a6.2 6.2 0 0 0 9.7 9.7z"/></symbol>

  <!-- week-strip sprouts (stand on the soil line: base at y=30) -->
  <symbol id="sprout-ok" viewBox="0 0 32 30"><path class="ill-stem ill-stem--thin" d="M16 30V13"/><path class="f-leaf" d="M16 20C9 20 4.5 16 4.5 9.5 11 9.5 16 13 16 20z"/><path class="f-leaf-light" d="M16 15.5C16 8.5 20 4 27.5 4c0 7-4 11.5-11.5 11.5z"/></symbol>
